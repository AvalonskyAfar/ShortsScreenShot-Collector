plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.shortvideocollector'
    compileSdk {
        version = release(36) {
            it.minorApiLevel = 1
        }
    }
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId 'com.example.shortvideocollector'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
